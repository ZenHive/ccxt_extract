acceptance_criteria = ["All five identified modules use `Paths.*` helpers (or document the exception — `tiers.ex`'s compile-time `@external_resource` may qualify)", "`paths_rw_split` (or sibling) invariant extended to flag read-side leaks on `priv/...` paths", "Existing tests under `CcxtExtract.PrivWriteCase` continue to isolate writes correctly", 'The new contract check fires on a deliberate `File.read!("priv/...")` fixture', "mix ccxt_extract.determinism_check --tier1 byte-identical across two runs", "time mix compile --warnings-as-errors clean; mix dialyzer.json --quiet clean; mix credo --strict --format json clean; mix ccxt_extract.contract_test passes"]
out_of_scope = ["A new `Paths.cp!/2` helper (waits on Task 127 — Reach position-aware sinks)", "Test-support files (already `:test`-only)", "v3 task surface (Task 143 owns)"]
files_to_modify = ["lib/ccxt_extract/overrides.ex", "lib/ccxt_extract/oxc_batch.ex", "lib/ccxt_extract/error_hierarchy.ex", "lib/ccxt_extract/base_methods.ex", "lib/ccxt_extract/tiers.ex", "lib/ccxt_extract/contract_test.ex"]
body = """
Several modules use `File.read!` / `File.write!` directly instead of routing through `CcxtExtract.Paths` helpers:

- `lib/ccxt_extract/overrides.ex` — `File.read!`
- `lib/ccxt_extract/oxc_batch.ex` — `File.read!`
- `lib/ccxt_extract/error_hierarchy.ex` — `File.read!`
- `lib/ccxt_extract/base_methods.ex` — `File.read!` + `File.write!`
- `lib/ccxt_extract/tiers.ex` — `File.read!` (note: compile-time `@external_resource`; may need special handling)

The `paths_rw_split` contract invariant (Reach taint analysis at `lib/ccxt_extract/contract_test.ex:2285`) catches direct `File.write!` inside read-aware functions but doesn't catch read-only leaks in modules that never write. The gap matters because `--output DIR` and `PrivWriteCase` rely on the `Paths.*` override hooks; direct `File.read!` on hardcoded `priv/...` paths silently bypasses both `:priv_dir_override` and `:priv_write_override`.

Route all reads through `Paths.priv/1` and writes through `Paths.out/1`. Extend the contract invariant (or add a sibling invariant) to flag direct `File.read!` / `File.write!` literals on `priv/...` paths.

Optional downstream-spec hook: for any pending task that introduces a new module under `lib/ccxt_extract/`, append an acceptance criterion enforcing the same convention. Less strict than Task 144's `depends_on` since the new invariant catches leaks at CI time regardless.

Plan: ~/.claude/plans/task-143-is-already-mellow-crystal.md
"""
