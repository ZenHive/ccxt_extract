htx (and likely others) build `const request = {..., Signature: signature}` then `url += '?' + this.urlencode(request)`. The placement is genuinely `query` with key `Signature`, but Task 65 derivation only tracks direct `query = ...` / `headers['K'] = ...` / `body = this.json({...})` assignments. Add an object-level propagation step: when an ObjectExpression with a sig-referencing property is bound to a variable, follow the variable into subsequent `url += '?' + this.urlencode(<var>)` / `body = this.urlencode(<var>)` statements and attribute the placement. Discovered during Task 65 (htx.private ships `signature_placement: null` until this lands). Distinct from the retired LFS Task 113 (corpus untracking) — same number in legacy ROADMAP, resolved separately.
"""

