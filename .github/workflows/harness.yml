# Deterministic Elixir harness gate for PRs.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover / dialyzer evidence as PR checks, instead
# of needing a local reviewer to fetch the branch and run the suite.
#
# No untrusted-input interpolation — only matrix, runner, beam outputs, hashFiles.
#
# Project-specific: `mix ccxt_extract.setup` runs before tests because
# `test/test_helper.exs` raises on missing corpus sentinels (priv/discoveries/*,
# priv/output/binance.json) — the corpus is gitignored derived state, materialized
# from the CCXT JS source on each fresh clone.
#
# Versions are sourced from `.tool-versions` (asdf format) at the repo root via
# `setup-beam` — guarantees CI and local dev never drift on `mix format` output.

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps & _build (covers dialyxir PLT default path)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      # tag_todo / tag_fixme stay enabled in .credo.exs (TODO/FIXME = tracked-debt
      # visibility, not regressions). Excluding them here lets the harness fail
      # only on real Credo regressions.
      - name: Credo (strict, excluding TODO/FIXME design tags)
        run: mix credo --strict --ignore TagTODO,TagFIXME

      - name: Doctor (--raise overrides .doctor.exs raise=false to gate CI)
        run: mix doctor --raise

      - name: Sobelow (honors .sobelow-conf, exit=Low)
        run: mix sobelow

      # Tests DISABLED in CI (2026-05-08).
      # Rationale: the offline surface (--exclude extraction --exclude flaky
      # --exclude integration) keeps tripping on corpus-coupled module-attribute
      # reads and other compile-time corpus dependencies that are awkward to
      # guard one-by-one. Local `mix test` (with materialized corpus) and
      # Cursor's cloud (working CCXT runtime access) remain the test gates;
      # this CI runs format / compile / credo / doctor / sobelow / dialyzer
      # only. Re-enable once the test surface is fully decoupled from corpus
      # state, or once a soak job materializes the corpus before tests.
      #
      # - name: Tests + coverage gate (>=70%) — offline surface only
      #   env:
      #     CCXT_EXTRACT_SKIP_CORPUS_CHECK: "1"
      #   run: mix test.json --cover --cover-threshold 70 --exclude extraction --exclude flaky --exclude integration

      - name: Dialyzer
        run: mix dialyzer
