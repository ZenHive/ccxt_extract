# Deterministic Elixir harness gate for PRs.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover / dialyzer evidence as PR checks, instead
# of needing a local reviewer to fetch the branch and run the suite.
#
# No untrusted-input interpolation — only matrix, runner, beam outputs, hashFiles.
#
# Project-specific: `mix ccxt_extract.setup` runs before tests because
# `test/test_helper.exs` raises on missing corpus sentinels (priv/discoveries/*,
# priv/output/binance.json) — the corpus is gitignored derived state, materialized
# from the CCXT JS source on each fresh clone.
#
# Versions are sourced from `.tool-versions` (asdf format) at the repo root via
# `setup-beam` — guarantees CI and local dev never drift on `mix format` output.

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps & _build (covers dialyxir PLT default path)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      # tag_todo / tag_fixme stay enabled in .credo.exs (TODO/FIXME = tracked-debt
      # visibility, not regressions). Excluding them here lets the harness fail
      # only on real Credo regressions.
      - name: Credo (strict, excluding TODO/FIXME design tags)
        run: mix credo --strict --ignore TagTODO,TagFIXME

      - name: Doctor (--raise overrides .doctor.exs raise=false to gate CI)
        run: mix doctor --raise

      - name: Sobelow (honors .sobelow-conf, exit=Low)
        run: mix sobelow

      # CI runs only the offline / pure-logic test surface. Corpus-dependent
      # integration tests (test/integration/cached/*) assert against the
      # freshly regenerated priv/output/ corpus, but corpus regen depends on
      # CCXT's loadMarkets() succeeding from a GitHub Actions runner IP —
      # Binance, Alpaca, and ~8 others geo-block the AWS ranges, which would
      # condition the gate on CCXT-runtime reliability rather than PR
      # correctness. Integration tests run locally (corpus materialized once
      # via `mix setup`) and on Cursor's cloud (working CCXT runtime access)
      # before the agent opens a PR. A future non-blocking soak job could
      # regen + run them on a schedule.
      #
      # Tag exclusions:
      #   :extraction  — drops modules that need the real CCXT source/bundle
      #                  (Describe, OXCExtractor, SigningFixtures, extractor
      #                  mix tasks); they report 0% offline regardless.
      #   :integration — drops cached-corpus tests (priv/output/ readers).
      #   :flaky       — gate side of tag-and-quarantine; tag offenders with
      #                  `@tag :flaky` and they drop out of the blocking run.
      #
      # CCXT_EXTRACT_SKIP_CORPUS_CHECK=1 tells test/test_helper.exs to skip
      # its sentinel-files halt — required because the corpus is no longer
      # materialized in this job. Local `mix test` keeps the fail-fast.
      #
      # Coverage tier: 70% — structural offline floor with `:extraction` and
      # `:integration` excluded. No `--summary-only`: the v0.3.0+ default
      # already prints failures-only, and on a red run the per-test detail
      # is what reviewers need (CI corollary in ex-unit-json.md).
      - name: Tests + coverage gate (>=70%) — offline surface only
        env:
          CCXT_EXTRACT_SKIP_CORPUS_CHECK: "1"
        run: mix test.json --cover --cover-threshold 70 --exclude extraction --exclude flaky --exclude integration

      - name: Dialyzer
        run: mix dialyzer
